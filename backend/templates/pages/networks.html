<div class="flex gap-4 p-4">
    <!-- Main Content -->
    <div class="flex-1">
        <div class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold text-green-500">[ NETWORKS ]</h1>
                <button type="button" 
                        class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded"
                        onclick="loadNetworkModal()">
                    <i class="bi bi-plus-circle mr-1"></i>Add Network
                </button>
            </div>

            <!-- Networks List -->
            <div id="networks-container">
                <div class="flex justify-center items-center h-32">
                    <div class="animate-spin rounded-full h-8 w-8 border-2 border-green-500 border-t-transparent"></div>
                    <span class="ml-3 text-gray-400">Loading networks...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Network Modal -->
<div class="modal" id="networkModal">
    <div class="flex justify-center items-center">
        <div class="bg-zinc-800 border border-green-600">
            <div id="network-modal-content">
                <!-- Content loaded via HTMX -->
            </div>
        </div>
    </div>
</div>

<!-- Network Delete Modal -->
<div class="modal" id="networkDeleteModal">
    <div class="flex justify-center items-center">
        <div class="bg-zinc-800 border border-red-500">
            <div id="network-delete-modal-content">
                <!-- Content loaded via HTMX -->
            </div>
        </div>
    </div>
</div>

<script>
// Load networks content
document.addEventListener('DOMContentLoaded', function() {
    // Load networks immediately
    loadNetworks();
    
    // Set up periodic refresh
    setInterval(loadNetworks, 15000);
});

function loadNetworks() {
    const container = document.getElementById('networks-container');
    if (!container) return;
    
    fetch('/api/networks')
        .then(response => response.json())
        .then(data => {
            container.innerHTML = renderNetworksTable(data.networks || []);
        })
        .catch(error => {
            console.error('Failed to load networks:', error);
            container.innerHTML = '<div class="text-red-400 p-4">Failed to load networks</div>';
        });
}

function renderNetworksTable(networks) {
    if (!networks || networks.length === 0) {
        return `
            <div class="text-center py-8 text-gray-400">
                <i class="bi bi-network-wired text-4xl mb-3"></i>
                <p>No networks configured</p>
                <p class="text-sm">Add a network to start scanning</p>
            </div>
        `;
    }
    
    return `
        <div class="bg-gray-800 rounded-lg overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-900">
                    <tr>
                        <th class="text-left p-3 text-green-500">Network</th>
                        <th class="text-left p-3 text-green-500">Name</th>
                        <th class="text-left p-3 text-green-500">Interface</th>
                        <th class="text-left p-3 text-green-500">Devices</th>
                        <th class="text-left p-3 text-green-500">Status</th>
                        <th class="text-left p-3 text-green-500">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${networks.map(network => `
                        <tr class="border-t border-gray-700 hover:bg-gray-700">
                            <td class="p-3">
                                <div class="text-green-500 font-mono">${network.cidr}</div>
                            </td>
                            <td class="p-3">
                                <span class="text-gray-300">${network.name || 'Unnamed'}</span>
                            </td>
                            <td class="p-3">
                                <span class="text-blue-400">${network.interface || '-'}</span>
                            </td>
                            <td class="p-3">
                                <span class="text-gray-400">${network.deviceCount || 0}</span>
                            </td>
                            <td class="p-3">
                                <span class="px-2 py-1 rounded text-xs ${network.active ? 'bg-green-600 text-white' : 'bg-gray-600 text-white'}">
                                    ${network.active ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td class="p-3">
                                <div class="flex gap-2">
                                    <button class="px-2 py-1 text-blue-400 border border-blue-400 rounded text-sm hover:bg-blue-400 hover:text-white transition-colors" 
                                            onclick="editNetwork('${network.id}')"
                                            title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="px-2 py-1 text-red-400 border border-red-400 rounded text-sm hover:bg-red-400 hover:text-white transition-colors" 
                                            onclick="deleteNetwork('${network.id}')"
                                            title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

// Network modal handling
document.addEventListener('htmx:afterRequest', function(event) {
    if (event.detail.target.id === 'network-modal-content') {
        showModal('networkModal');
    }
    if (event.detail.target.id === 'network-delete-modal-content') {
        showModal('networkDeleteModal');
    }
});

// Global functions for network operations
function loadNetworkModal() {
    fetch('/api/network-modal')
        .then(response => response.text())
        .then(html => {
            document.getElementById('network-modal-content').innerHTML = html;
            showModal('networkModal');
        });
}

window.editNetwork = function(networkId) {
    fetch(`/api/network-modal/${networkId}`)
        .then(response => response.text())
        .then(html => {
            document.getElementById('network-modal-content').innerHTML = html;
            showModal('networkModal');
        });
};

window.deleteNetwork = function(networkId) {
    fetch(`/api/network-delete-modal/${networkId}`)
        .then(response => response.text())
        .then(html => {
            document.getElementById('network-delete-modal-content').innerHTML = html;
            showModal('networkDeleteModal');
        });
};
</script>
