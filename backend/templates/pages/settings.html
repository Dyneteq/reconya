<div class="flex gap-4 p-4">
    <!-- Main Content -->
    <div class="flex-1 lg:w-3/4">
        <div class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold text-green-500">[ SETTINGS ]</h1>
            </div>

            <!-- Settings Content -->
            <div id="settings-container" class="bg-gray-800 rounded-lg">
                <div class="flex justify-center items-center h-32">
                    <div class="animate-spin rounded-full h-8 w-8 border-2 border-green-500 border-t-transparent"></div>
                    <span class="ml-3 text-gray-400">Loading settings...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings sidebar/help -->
    <div class="w-full lg:w-1/4">
        <div class="bg-gray-800 rounded-lg p-4">
            <div class="flex items-center mb-3">
                <i class="bi bi-info-circle text-green-500 mr-2"></i>
                <h6 class="text-green-500 font-bold">Settings Help</h6>
            </div>
            <div class="space-y-3 text-sm text-gray-300">
                <div>
                    <strong class="text-white">Network Scanning:</strong> Configure how often and which networks to scan for devices.
                </div>
                <div>
                    <strong class="text-white">Screenshots:</strong> Enable automatic screenshot capture when devices are detected.
                </div>
                <div>
                    <strong class="text-white">Notifications:</strong> Set up alerts for network changes and device status updates.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Load settings content
document.addEventListener('DOMContentLoaded', function() {
    // Load settings immediately
    loadSettings();
});

function loadSettings() {
    const container = document.getElementById('settings-container');
    if (!container) return;
    
    fetch('/api/settings')
        .then(response => response.json())
        .then(data => {
            container.innerHTML = renderSettings(data.settings || {});
        })
        .catch(error => {
            console.error('Failed to load settings:', error);
            container.innerHTML = '<div class="text-red-400 p-4">Failed to load settings</div>';
        });
}

function renderSettings(settings) {
    return `
        <div class="p-6">
            <form id="settings-form" class="space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-green-500 mb-4">Network Scanning</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <label class="text-white font-medium">Enable Screenshots</label>
                                <p class="text-gray-400 text-sm">Automatically capture screenshots of web services</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" 
                                       name="screenshots_enabled" 
                                       class="sr-only peer" 
                                       ${settings.screenshots_enabled ? 'checked' : ''}
                                       onchange="updateScreenshotSetting(this.checked)">
                                <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                            </label>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <div>
                                <label class="text-white font-medium">Auto Scan</label>
                                <p class="text-gray-400 text-sm">Automatically scan networks periodically</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" 
                                       name="auto_scan" 
                                       class="sr-only peer" 
                                       ${settings.auto_scan ? 'checked' : ''}>
                                <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-lg font-semibold text-green-500 mb-4">Notifications</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <label class="text-white font-medium">Device Alerts</label>
                                <p class="text-gray-400 text-sm">Get notified when new devices are found</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" 
                                       name="device_alerts" 
                                       class="sr-only peer" 
                                       ${settings.device_alerts ? 'checked' : ''}>
                                <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600"></div>
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    `;
}

function updateScreenshotSetting(enabled) {
    const formData = new FormData();
    formData.append('screenshots_enabled', enabled);
    
    fetch('/api/settings/screenshots', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('Screenshot setting updated');
        } else {
            console.error('Failed to update screenshot setting');
        }
    })
    .catch(error => {
        console.error('Error updating screenshot setting:', error);
    });
}
</script>
