{{define "components/network-map.html"}}
{{if .BaseIP}}
<!-- Debug: BaseIP={{.BaseIP}}, DeviceCount={{len .Devices}}, IPRangeCount={{len .IPRange}} -->
<div class="flex flex-wrap gap-1 justify-start">
    {{$baseIP := .BaseIP}}
    {{$devices := .Devices}}
    {{range $i, $ipPart := .IPRange}}
        {{$fullIP := printf "%s.%d" $baseIP $ipPart}}
        {{$device := index $devices $fullIP}}
        <button type="button"
                class="w-5 h-5 rounded-sm transition-all duration-200 hover:scale-110 {{if $device}}{{if eq $device.Status "online"}}bg-green-600 border-2 border-green-500{{else if eq $device.Status "idle"}}bg-green-300 border border-green-400 opacity-70{{else if eq $device.Status "offline"}}bg-gray-500 border border-gray-400 opacity-40{{else}}bg-gray-500 border border-gray-400 opacity-40{{end}}{{else}}bg-gray-600 border border-gray-500 opacity-20{{end}}"
                {{if $device}}onclick="loadDeviceModal('{{$device.ID}}')"{{else}}onclick="loadNewScanModal('{{$fullIP}}')"{{end}}
                title="{{$fullIP}}{{if $device}} - {{$device.Status}} ({{$device.ID}}){{else}} - Available IP{{end}}"
                data-status="{{if $device}}{{$device.Status}}{{else}}empty{{end}}"
                data-ip="{{$fullIP}}">
        </button>
    {{end}}
</div>
{{else}}
<div class="flex items-center justify-center py-8 text-gray-400">
    <div class="text-center">
        <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <p class="text-sm">Select a network to view the network map</p>
    </div>
</div>
{{end}}
{{end}}
