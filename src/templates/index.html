<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reconYa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/devices.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Roboto+Condensed:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200" style="font-family: 'Roboto Condensed', sans-serif; font-size: 0.875rem;">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-800 border-b border-gray-700">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <span class="text-2xl font-bold text-green-500" style="font-family: 'Orbitron', monospace; font-weight: 800;">
                    <i class="ti ti-network mr-2"></i>reconYa
                </span>
                <div class="flex items-center gap-3">
                    <span class="text-gray-400 text-sm"><span id="devices-count" class="text-green-500 font-bold">0</span> devices</span>
                    <button id="themeToggle" class="p-2 text-gray-300 hover:text-green-500 bg-gray-700 rounded transition-colors">
                        <svg id="sunIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <svg id="moonIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <form action="/logout" method="POST">
                        <button type="submit" class="p-2 text-gray-300 hover:text-green-500 bg-gray-700 rounded transition-colors" title="Logout">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </header>

        <!-- Results Table -->
        <main class="flex-1 py-6">
            <div class="max-w-7xl mx-auto px-4">
                <div class="bg-gray-800 rounded-lg overflow-hidden">
                    <div id="results-table" class="overflow-x-auto">
                        <div class="flex justify-center items-center py-12">
                            <div class="animate-spin rounded-full h-8 w-8 border-2 border-green-500 border-t-transparent"></div>
                            <span class="ml-3 text-gray-400">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Device Modal -->
    <div id="deviceModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-container">
            <div class="modal-content max-w-3xl max-h-[90vh] overflow-y-auto">
                <div id="device-modal-content"></div>
            </div>
        </div>
    </div>

    <style>
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal.show { opacity: 1; visibility: visible; }
        .modal-backdrop { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); cursor: pointer; }
        .modal-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 1rem; pointer-events: none; }
        .modal-content { background: var(--bg-secondary); border-radius: 0.5rem; border: 1px solid var(--border-accent); max-width: 90vw; max-height: 90vh; overflow-y: auto; pointer-events: all; transform: scale(0.9); transition: transform 0.3s ease; }
        .modal.show .modal-content { transform: scale(1); }

        :root { --bg-primary: #111827; --bg-secondary: #1f2937; --bg-tertiary: #374151; --text-primary: #f9fafb; --text-secondary: #d1d5db; --text-muted: #9ca3af; --border-color: #4b5563; --border-accent: #10b981; }
        [data-theme="light"] { --bg-primary: #f9fafb; --bg-secondary: #f3f4f6; --bg-tertiary: #e5e7eb; --text-primary: #111827; --text-secondary: #374151; --text-muted: #6b7280; --border-color: #d1d5db; --border-accent: #059669; }
        body { background-color: var(--bg-primary); color: var(--text-primary); }

        html[data-theme="light"] body { background-color: #f9fafb !important; color: #111827 !important; }
        html[data-theme="light"] .bg-gray-800, html[data-theme="light"] header { background-color: #ffffff !important; border-color: #e5e7eb !important; }
        html[data-theme="light"] .bg-gray-700 { background-color: #f3f4f6 !important; }
        html[data-theme="light"] .text-gray-200, html[data-theme="light"] .text-white { color: #111827 !important; }
        html[data-theme="light"] .text-gray-300, html[data-theme="light"] .text-gray-400 { color: #6b7280 !important; }
        html[data-theme="light"] .text-green-500 { color: #059669 !important; }
        html[data-theme="light"] .border-gray-700 { border-color: #e5e7eb !important; }
        html[data-theme="light"] table thead { background-color: #f3f4f6 !important; }
        html[data-theme="light"] table tbody tr:hover { background-color: #f3f4f6 !important; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initTheme === 'function') initTheme();
            loadDeviceTable();
            setInterval(loadDeviceTable, 10000);
        });

        function loadDeviceTable() {
            const container = document.getElementById('results-table');
            if (!container) return;

            fetch('/api/devices', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    const devices = data.devices || [];
                    document.getElementById('devices-count').textContent = devices.length;

                    if (devices.length === 0) {
                        container.textContent = '';
                        const emptyDiv = document.createElement('div');
                        emptyDiv.className = 'text-center py-12 text-gray-400';
                        emptyDiv.innerHTML = '<i class="ti ti-router-off text-4xl mb-3 block opacity-50"></i><p>No devices found</p>';
                        container.appendChild(emptyDiv);
                        return;
                    }
                    renderResultsTable(container, devices);
                })
                .catch(error => {
                    console.error('Error:', error);
                    container.textContent = '';
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'text-red-400 p-4 text-center';
                    errorDiv.textContent = 'Failed to load devices';
                    container.appendChild(errorDiv);
                });
        }

        function renderResultsTable(container, devices) {
            container.textContent = '';
            const table = document.createElement('table');
            table.className = 'w-full';

            const thead = document.createElement('thead');
            thead.className = 'bg-gray-700';
            const headerRow = document.createElement('tr');
            ['Status', 'IP Address', 'MAC Address', 'Hostname', 'Ports', 'Last Seen'].forEach(text => {
                const th = document.createElement('th');
                th.className = 'px-4 py-3 text-left text-green-500 font-semibold text-sm';
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            tbody.className = 'divide-y divide-gray-700';

            devices.forEach(device => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-700 transition-colors cursor-pointer';
                row.onclick = function() { loadDeviceModal(device.id); };

                const status = device.status || 'unknown';
                const ip = device.ipv4 || device.ip || 'N/A';
                const mac = device.mac || '-';
                const hostname = device.hostname || device.name || '-';
                const lastSeen = device.LastSeenOnlineAt || device.last_seen_online_at;
                let openPorts = 0;
                if (device.ports && Array.isArray(device.ports)) {
                    openPorts = device.ports.filter(p => p.state === 'open').length;
                }

                // Status
                const statusCell = document.createElement('td');
                statusCell.className = 'px-4 py-3';
                const statusDiv = document.createElement('div');
                statusDiv.className = 'flex items-center';
                const dot = document.createElement('div');
                dot.className = 'w-3 h-3 rounded-full ' + (status === 'online' ? 'bg-green-500' : status === 'offline' ? 'bg-red-500' : 'bg-gray-500');
                statusDiv.appendChild(dot);
                statusCell.appendChild(statusDiv);
                row.appendChild(statusCell);

                // IP
                const ipCell = document.createElement('td');
                ipCell.className = 'px-4 py-3 font-mono text-white';
                ipCell.textContent = ip;
                row.appendChild(ipCell);

                // MAC
                const macCell = document.createElement('td');
                macCell.className = 'px-4 py-3 font-mono text-sm text-blue-400';
                macCell.textContent = mac;
                row.appendChild(macCell);

                // Hostname
                const hostnameCell = document.createElement('td');
                hostnameCell.className = 'px-4 py-3 text-gray-300';
                hostnameCell.textContent = hostname;
                row.appendChild(hostnameCell);

                // Ports
                const portsCell = document.createElement('td');
                portsCell.className = 'px-4 py-3';
                if (openPorts > 0) {
                    const span = document.createElement('span');
                    span.className = 'px-2 py-1 bg-red-500 bg-opacity-20 text-red-400 text-xs rounded';
                    span.textContent = openPorts + ' open';
                    portsCell.appendChild(span);
                } else {
                    portsCell.textContent = '-';
                    portsCell.className += ' text-gray-500';
                }
                row.appendChild(portsCell);

                // Last seen
                const lastSeenCell = document.createElement('td');
                lastSeenCell.className = 'px-4 py-3 text-sm text-gray-400';
                lastSeenCell.textContent = lastSeen ? formatTime(lastSeen) : '-';
                row.appendChild(lastSeenCell);

                tbody.appendChild(row);
            });

            table.appendChild(tbody);
            container.appendChild(table);
        }

        function formatTime(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                const diffMs = Date.now() - date;
                const mins = Math.floor(diffMs / 60000);
                if (mins < 1) return 'now';
                if (mins < 60) return mins + 'm';
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return hrs + 'h';
                return Math.floor(hrs / 24) + 'd';
            } catch (e) { return '-'; }
        }

        window.loadDeviceTable = loadDeviceTable;
    </script>
</body>
</html>
