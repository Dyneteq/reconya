<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reconYa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/devices.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header>
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="logo">
                    <i class="ti ti-network"></i> reconYa
                </div>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
                    <i class="ti ti-menu-2"></i>
                </button>
                <div class="nav-right" id="nav-right">
                    <span class="status-text">
                        <span class="blink">&gt;</span> <span id="devices-count">0</span> TARGETS ACQUIRED
                    </span>
                    <button type="button" class="btn-logout" onclick="showLogoutModal()" title="Logout">
                        <i class="ti ti-logout"></i> EXIT
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 py-6">
            <div class="max-w-7xl mx-auto px-4">
                <!-- Network Setup (shown when no networks configured) -->
                <div id="network-setup" class="terminal" style="display: none; margin-bottom: 20px;">
                    <div class="terminal-header">
                        <span class="blink">!</span> NETWORK_CONFIG_REQUIRED
                    </div>
                    <div class="network-setup-body">
                        <p>NO NETWORKS CONFIGURED FOR SCANNING</p>
                        <div id="detected-networks"></div>
                    </div>
                </div>

                <div class="terminal">
                    <div class="terminal-header">
                        <span class="blink">&gt;</span> NETWORK_SCAN // LIVE_FEED
                    </div>
                    <div id="results-table">
                        <div class="loading">
                            <div class="spinner"></div>
                            SCANNING NETWORK...
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <div class="scanline"></div>
        </footer>
    </div>

    <!-- Device Modal -->
    <div id="deviceModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-container">
            <div class="modal-content">
                <div id="device-modal-content"></div>
            </div>
        </div>
    </div>

    <!-- Logout Modal -->
    <div id="logoutModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-container">
            <div class="modal-content logout-modal">
                <div class="logout-modal-header">
                    <span class="blink">!</span> CONFIRM_DISCONNECT
                </div>
                <div class="logout-modal-body">
                    <p>TERMINATE SESSION?</p>
                    <p class="logout-warning">ALL ACTIVE MONITORING WILL CEASE</p>
                </div>
                <div class="logout-modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('logoutModal')">[CANCEL]</button>
                    <form action="/logout" method="POST" class="logout-form-inline">
                        <button type="submit" class="btn-confirm">[CONFIRM EXIT]</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Vignette effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 999;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.8rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 40px #0f0;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 2rem;
        }

        header {
            border-bottom: 1px solid #0f03;
            background: rgba(0, 20, 0, 0.8);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logout-form {
            display: flex;
            align-items: center;
        }

        .status-text {
            color: #0f0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            line-height: 1;
        }

        .btn {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #f00;
            color: #f00;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .btn-logout:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 20px #f00;
        }

        .logout-modal {
            max-width: 400px;
            text-align: center;
        }

        .logout-modal-header {
            padding: 16px;
            border-bottom: 1px solid #f003;
            color: #f00;
            font-size: 14px;
            letter-spacing: 2px;
            background: rgba(255, 0, 0, 0.05);
        }

        .logout-modal-body {
            padding: 30px 20px;
        }

        .logout-modal-body p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .logout-warning {
            color: #f00;
            font-size: 11px !important;
            letter-spacing: 1px;
        }

        .logout-modal-actions {
            display: flex;
            gap: 12px;
            padding: 20px;
            border-top: 1px solid #0f03;
            justify-content: center;
        }

        .logout-form-inline {
            display: inline;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 12px;
        }

        .btn-cancel:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }

        .btn-confirm {
            background: transparent;
            border: 1px solid #f00;
            color: #f00;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 12px;
        }

        .btn-confirm:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 15px #f00;
        }

        .terminal {
            border: 1px solid #0f03;
            background: rgba(0, 10, 0, 0.6);
        }

        .terminal-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0f03;
            color: #0f0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 255, 0, 0.05);
        }

        .network-setup-body {
            padding: 20px;
            text-align: center;
        }

        .network-setup-body p {
            margin-bottom: 16px;
            color: #f80;
        }

        .detected-network {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 8px;
            padding: 10px 16px;
            border: 1px solid #0f03;
            background: rgba(0, 255, 0, 0.05);
        }

        .detected-network span {
            color: #0f0;
            font-size: 14px;
        }

        .btn-add-network {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 11px;
        }

        .btn-add-network:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 10px #0f0;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #0f0;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #0f03;
            border-top-color: #0f0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink 1s infinite;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            color: #0f0;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            border-bottom: 1px solid #0f03;
            background: rgba(0, 255, 0, 0.03);
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid #0f01;
        }

        tr {
            transition: all 0.2s;
            cursor: pointer;
        }

        tr:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        tr:hover td {
            color: #fff;
            text-shadow: 0 0 5px #0f0;
        }

        .ip {
            color: #0f0;
            font-weight: bold;
        }

        .mac {
            color: #0a0;
            font-size: 12px;
        }

        .vendor {
            color: #0a0;
            font-size: 12px;
        }

        .hostname {
            color: #080;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online {
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
        }

        .status-offline {
            background: #f00;
            box-shadow: 0 0 10px #f00;
        }

        .ports-badge {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #f00;
            color: #f00;
            padding: 2px 8px;
            font-size: 11px;
        }

        .time {
            color: #060;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #040;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        footer {
            position: relative;
            height: 2px;
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0f0, transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
        }

        .modal-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        .modal-content {
            background: #000;
            border: 1px solid #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), inset 0 0 30px rgba(0, 255, 0, 0.05);
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: all;
        }

        /* Mobile menu button */
        .mobile-menu-btn {
            display: none;
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .mobile-menu-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }

        /* Mobile responsive */
        @media (max-width: 640px) {
            .mobile-menu-btn {
                display: block;
            }

            .nav-right {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(0, 20, 0, 0.95);
                border-top: 1px solid #0f03;
                border-bottom: 1px solid #0f03;
                flex-direction: column;
                padding: 16px;
                gap: 12px;
                z-index: 100;
            }

            .nav-right.show {
                display: flex;
            }

            header > div {
                position: relative;
            }

            .status-text {
                text-align: center;
            }

            .btn-logout {
                width: 100%;
            }

            .logo {
                font-size: 1.4rem;
            }

            .logo i {
                font-size: 1.6rem;
            }

            th, td {
                padding: 8px 10px;
                font-size: 11px;
            }

            .terminal-header {
                font-size: 10px;
                padding: 10px 12px;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkNetworks();
            loadDeviceTable();
            setInterval(loadDeviceTable, 10000);
        });

        function checkNetworks() {
            fetch('/api/networks', { credentials: 'include' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var networks = data.networks || [];
                    if (networks.length === 0) {
                        document.getElementById('network-setup').style.display = 'block';
                        loadDetectedNetworks();
                    } else {
                        document.getElementById('network-setup').style.display = 'none';
                    }
                })
                .catch(function(e) { console.error(e); });
        }

        function loadDetectedNetworks() {
            fetch('/api/networks/detected', { credentials: 'include' })
                .then(function(r) { return r.json(); })
                .then(function(networks) {
                    var container = document.getElementById('detected-networks');
                    container.textContent = '';

                    if (networks.length === 0) {
                        container.textContent = 'No networks detected';
                        return;
                    }

                    networks.forEach(function(net) {
                        var div = document.createElement('div');
                        div.className = 'detected-network';

                        var span = document.createElement('span');
                        span.textContent = net.cidr || net.CIDR;
                        div.appendChild(span);

                        var btn = document.createElement('button');
                        btn.className = 'btn-add-network';
                        btn.textContent = '[ADD]';
                        btn.onclick = function() { addNetwork(net.cidr || net.CIDR); };
                        div.appendChild(btn);

                        container.appendChild(div);
                    });
                })
                .catch(function(e) { console.error(e); });
        }

        function addNetwork(cidr) {
            var formData = new FormData();
            formData.append('cidr', cidr);

            fetch('/api/networks/suggestion', {
                method: 'POST',
                credentials: 'include',
                body: formData
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    document.getElementById('network-setup').style.display = 'none';
                    loadDeviceTable();
                }
            })
            .catch(function(e) { console.error(e); });
        }

        function loadDeviceTable() {
            var container = document.getElementById('results-table');
            if (!container) return;

            fetch('/api/devices', { credentials: 'include' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var devices = data.devices || [];
                    document.getElementById('devices-count').textContent = devices.length;

                    if (devices.length === 0) {
                        container.textContent = '';
                        var empty = document.createElement('div');
                        empty.className = 'empty-state';
                        var icon = document.createElement('i');
                        icon.className = 'ti ti-radar-off';
                        empty.appendChild(icon);
                        var text = document.createElement('div');
                        text.textContent = 'NO TARGETS DETECTED';
                        empty.appendChild(text);
                        container.appendChild(empty);
                        return;
                    }
                    renderTable(container, devices);
                })
                .catch(function(e) {
                    console.error(e);
                    container.textContent = '';
                    var err = document.createElement('div');
                    err.className = 'empty-state';
                    err.textContent = 'CONNECTION ERROR';
                    container.appendChild(err);
                });
        }

        function renderTable(container, devices) {
            container.textContent = '';
            var table = document.createElement('table');

            var thead = document.createElement('thead');
            var headerRow = document.createElement('tr');
            ['Status', 'IP Address', 'MAC', 'Vendor', 'Hostname', 'Ports', 'Last Seen'].forEach(function(t) {
                var th = document.createElement('th');
                th.textContent = t;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            var tbody = document.createElement('tbody');
            devices.forEach(function(d) {
                var row = document.createElement('tr');
                row.onclick = function() { loadDeviceModal(d.id); };

                // Status
                var statusTd = document.createElement('td');
                var dot = document.createElement('span');
                dot.className = 'status-dot ' + (d.status === 'online' ? 'status-online' : 'status-offline');
                statusTd.appendChild(dot);
                row.appendChild(statusTd);

                // IP
                var ipTd = document.createElement('td');
                ipTd.className = 'ip';
                ipTd.textContent = d.ipv4 || d.ip || '-';
                row.appendChild(ipTd);

                // MAC
                var macTd = document.createElement('td');
                macTd.className = 'mac';
                macTd.textContent = d.mac || '-';
                row.appendChild(macTd);

                // Vendor
                var vendorTd = document.createElement('td');
                vendorTd.className = 'vendor';
                vendorTd.textContent = d.vendor || '-';
                row.appendChild(vendorTd);

                // Hostname
                var hostTd = document.createElement('td');
                hostTd.className = 'hostname';
                hostTd.textContent = d.hostname || d.name || '-';
                row.appendChild(hostTd);

                // Ports
                var portsTd = document.createElement('td');
                var openPorts = 0;
                if (d.ports && Array.isArray(d.ports)) {
                    openPorts = d.ports.filter(function(p) { return p.state === 'open'; }).length;
                }
                if (openPorts > 0) {
                    var badge = document.createElement('span');
                    badge.className = 'ports-badge';
                    badge.textContent = openPorts + ' OPEN';
                    portsTd.appendChild(badge);
                } else {
                    portsTd.textContent = '-';
                    portsTd.className = 'time';
                }
                row.appendChild(portsTd);

                // Last seen
                var timeTd = document.createElement('td');
                timeTd.className = 'time';
                var lastSeen = d.LastSeenOnlineAt || d.last_seen_online_at;
                timeTd.textContent = lastSeen ? formatTime(lastSeen) : '-';
                row.appendChild(timeTd);

                tbody.appendChild(row);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        function formatTime(dateString) {
            try {
                var date = new Date(dateString);
                var mins = Math.floor((Date.now() - date) / 60000);
                if (mins < 1) return 'NOW';
                if (mins < 60) return mins + 'M AGO';
                var hrs = Math.floor(mins / 60);
                if (hrs < 24) return hrs + 'H AGO';
                return Math.floor(hrs / 24) + 'D AGO';
            } catch (e) { return '-'; }
        }

        function showLogoutModal() {
            showModal('logoutModal');
        }

        function toggleMobileMenu() {
            var nav = document.getElementById('nav-right');
            nav.classList.toggle('show');
        }

        window.loadDeviceTable = loadDeviceTable;
        window.showLogoutModal = showLogoutModal;
        window.toggleMobileMenu = toggleMobileMenu;
    </script>
</body>
</html>
