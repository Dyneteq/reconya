<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reconYa // LOGIN</title>
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- CRT effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="container">
        <div class="terminal">
            <div class="terminal-header">
                <span class="blink">&gt;</span> SYSTEM_ACCESS
            </div>

            <div class="terminal-body">
                <div class="logo">
                    <i class="ti ti-network"></i> reconYa
                </div>

                <div class="subtitle">NETWORK RECONNAISSANCE SYSTEM</div>

                {{if .Error}}
                <div class="error">
                    <span class="blink">!</span> ACCESS DENIED: {{.Error}}
                </div>
                {{end}}

                <form action="/login" method="POST" class="form">
                    <div class="field">
                        <label>&gt; USERNAME</label>
                        <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>
                    </div>

                    <div class="field">
                        <label>&gt; PASSWORD</label>
                        <input type="password" name="password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn">
                        [AUTHENTICATE]
                    </button>
                </form>

                <div class="hint">DEFAULT: admin / password</div>
            </div>
        </div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 999;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .terminal {
            border: 1px solid #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2), inset 0 0 30px rgba(0, 255, 0, 0.02);
        }

        .terminal-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0f03;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 255, 0, 0.05);
        }

        .terminal-body {
            padding: 30px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 40px #0f0;
            letter-spacing: 3px;
        }

        .logo i {
            margin-right: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 10px;
            letter-spacing: 3px;
            color: #060;
            margin-bottom: 30px;
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #f00;
            color: #f00;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            letter-spacing: 2px;
            color: #0a0;
        }

        input {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #0f03;
            color: #0f0;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        input::placeholder {
            color: #040;
        }

        .btn {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 14px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        .hint {
            text-align: center;
            font-size: 10px;
            color: #040;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink 1s infinite;
        }
    </style>
</body>
</html>
